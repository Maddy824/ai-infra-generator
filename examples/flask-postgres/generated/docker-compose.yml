# Generated by ai-infra. Values for ${VARS} are read from .env
# (see .env.example).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres
    environment:
      PORT: "5000"
      DATABASE_URL: "${DATABASE_URL}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "app"
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
