apiVersion: apps/v1
kind: Deployment
metadata:
  name: "web"
  labels:
    app: "web"
    project: "flask-postgres"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "web"
  template:
    metadata:
      labels:
        app: "web"
        project: "flask-postgres"
    spec:
      initContainers:
        - name: "wait-for-postgres"
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: "web"
          image: "ghcr.io/flask-postgres/web:latest"
          ports:
            - containerPort: 5000
              protocol: "TCP"
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: "PORT"
              value: "5000"
            - name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "flask-postgres-secrets"
                  key: "DATABASE_URL"
