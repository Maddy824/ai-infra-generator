apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "flask-postgres-ingress"
  labels:
    project: "flask-postgres"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: "nginx"
  rules:
    - host: "flask-postgres.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "web"
                port:
                  number: 5000
